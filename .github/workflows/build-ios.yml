name: Build iOS Xcode App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Xcode App (Simulator / Universal)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
                     -scheme App \
                     -configuration Release \
                     -sdk iphonesimulator \
                     -derivedDataPath ios/build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     build

      - name: Zip iOS Xcode Build
        run: |
          zip -r DormRecipeExchange-iOS-Build.zip ios/build/Build/Products/Release-iphonesimulator/App.app

      - name: Upload iOS Xcode Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DormRecipeExchange-iOS-App
          path: DormRecipeExchange-iOS-Build.zip
